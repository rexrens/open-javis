[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "javis-ai"
version = "0.1.9"
description = "Open-source Python port of Claude Code - an AI-powered CLI coding assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "novix-science" },
]

dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "slack-sdk>=3.0.0",
    "python-telegram-bot>=21.0.0",
    "discord.py>=2.0.0",
    "lark-oapi>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
javis = "javis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["javis"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "javis/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "javis/_frontend/tsconfig.json"
"frontend/terminal/src" = "javis/_frontend/src"
"frontend/web/package.json" = "javis/_frontend_web/package.json"
"frontend/web/README.md" = "javis/_frontend_web/README.md"
"frontend/web/LICENSE.deepseek-harness" = "javis/_frontend_web/LICENSE.deepseek-harness"
"frontend/web/composition.json" = "javis/_frontend_web/composition.json"
"frontend/web/prepare.mjs" = "javis/_frontend_web/prepare.mjs"
"frontend/web/boot.json" = "javis/_frontend_web/boot.json"
"frontend/web/manifest.json" = "javis/_frontend_web/manifest.json"
"frontend/web/dist" = "javis/_frontend_web/dist"
"frontend/web/plugins" = "javis/_frontend_web/plugins"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/**/fixtures/**"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "debugpy",
]
